workflows:
  jona-academy-ios:
    name: Jona Academy - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: jona-academy
    environment:
      groups:
        - ios_signing # shto këtu (te Codemagic → Environment variables) çelësat e signing-ut
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.jonaacademy.app"
      xcode: latest
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID") + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sm@teenchallengealbania.org
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration # lidhe në Codemagic UI me llogarinë Apple Developer
        submit_to_testflight: true
